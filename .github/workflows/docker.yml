name: Docker

on: [push, pull_request, workflow_dispatch]

# packages: write lets the automatic GITHUB_TOKEN push to ghcr.io, so there is
# no registry secret to create or rotate. Docker Hub is not published to.
permissions:
  contents: read
  packages: write

# adapted from https://raw.githubusercontent.com/stefanprodan/podinfo/master/.github/workflows/release.yml
#
jobs:
  containers:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/arkounm/entwine2tiles
      # Feature branches and pull requests build and smoke test but publish
      # nothing, so the registry only ever sees main and tags.
      PUSH_PACKAGES: ${{ github.repository_owner == 'ArkounM' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: --debug
      - name: Prepare
        id: prep
        run: |
          VERSION=sha-${GITHUB_SHA::8}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF/refs\/tags\//}
          fi
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      # Loaded rather than pushed, so the smoke test below is what decides
      # whether this image is fit to publish.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./scripts/docker/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.prep.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.prep.outputs.VERSION }}
            org.opencontainers.image.created=${{ steps.prep.outputs.BUILD_DATE }}
            org.opencontainers.image.licenses=LGPL-2.1-or-later

      # The image ships a conda environment that was packed and then unpacked
      # onto a bare Ubuntu, so "does the binary still resolve its libraries" is
      # the one thing worth proving before anything is published.
      - name: Smoke test the image
        run: |
          docker run --rm ${IMAGE}:${{ steps.prep.outputs.VERSION }} help
          docker run --rm ${IMAGE}:${{ steps.prep.outputs.VERSION }} build --help > /dev/null
          docker run --rm ${IMAGE}:${{ steps.prep.outputs.VERSION }} convert --help > /dev/null

      - if: ${{ env.PUSH_PACKAGES == 'true' }}
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ env.PUSH_PACKAGES == 'true' }}
        name: Push image
        run: |
          docker push ${IMAGE}:${{ steps.prep.outputs.VERSION }}
          # Only main and tags reach this step, so latest always points at the
          # newest published build.
          docker tag ${IMAGE}:${{ steps.prep.outputs.VERSION }} ${IMAGE}:latest
          docker push ${IMAGE}:latest
