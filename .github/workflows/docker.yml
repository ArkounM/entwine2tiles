name: Docker

on: [push, pull_request, workflow_dispatch]

# packages: write lets the automatic GITHUB_TOKEN push to ghcr.io, so there is
# no registry secret to create or rotate. Docker Hub is not published to.
permissions:
  contents: read
  packages: write

# adapted from https://raw.githubusercontent.com/stefanprodan/podinfo/master/.github/workflows/release.yml
#
jobs:
  containers:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/arkounm/entwine2tiles
      # Branches and pull requests build and smoke test but publish nothing.
      PUSH_PACKAGES: ${{ github.repository_owner == 'ArkounM' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: --debug
      - name: Prepare
        id: prep
        run: |
          VERSION=sha-${GITHUB_SHA::8}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF/refs\/tags\//}
          fi
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "REF=${IMAGE}:${VERSION}" >> $GITHUB_ENV

      # Loaded rather than pushed, so the smoke test decides whether this image
      # is fit to publish.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./scripts/docker/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.prep.outputs.VERSION }}
            org.opencontainers.image.created=${{ steps.prep.outputs.BUILD_DATE }}
            org.opencontainers.image.licenses=LGPL-2.1-or-later

      # The image is a conda environment packed and unpacked onto a bare Ubuntu,
      # so "can the binary still resolve its libraries" is the thing worth
      # proving before anything is published.
      - name: Smoke test the image
        run: |
          for args in "help" "build --help" "convert --help"; do
            docker run --rm $REF $args > /dev/null
          done

      - name: Diagnose a failed smoke test
        if: failure()
        run: |
          probe() {
            echo "--- $1"
            docker run --rm --entrypoint /bin/bash "$REF" -c "$1" 2>&1 | head -40 || true
          }
          OUT=$(
            probe 'ls -l /var/task/bin/entwine2tiles'
            probe '/var/task/bin/entwine2tiles help'
            probe 'ldd /var/task/bin/entwine2tiles'
          )
          # Job logs need repo admin rights to read back and annotations do not,
          # so the evidence goes out as one, percent-encoded per the
          # workflow-command rules.
          OUT=${OUT//'%'/'%25'}
          OUT=${OUT//$'\r'/'%0D'}
          OUT=${OUT//$'\n'/'%0A'}
          echo "::error title=smoke test diagnostics::${OUT:0:3500}"

      - if: ${{ env.PUSH_PACKAGES == 'true' }}
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ env.PUSH_PACKAGES == 'true' }}
        name: Push image
        run: |
          docker push $REF
          docker tag $REF ${IMAGE}:latest
          docker push ${IMAGE}:latest
