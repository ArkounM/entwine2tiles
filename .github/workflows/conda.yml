name: Conda

on:
  push:
      paths-ignore:
          - 'doc/**'
  pull_request:
      paths-ignore:
          - 'doc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Conda ${{ matrix.platform }}

    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing should not hide the other two.
      fail-fast: false
      matrix:
        platform: ['ubuntu-latest','windows-latest','macos-latest']
    env:
      PDAL_PLATFORM: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4

    - name: Support longpaths
      run: git config --system core.longpaths true
      if: matrix.platform == 'windows-latest'

    - uses: conda-incubator/setup-miniconda@v3
      with:
        channels: conda-forge
        environment-file: "scripts/ci/environment.yml"
        environment-name: "entwine-build"

    - name: Setup
      shell: bash -el {0}
      run: |
          source ./scripts/ci/conda/setup.sh

    - name: Build
      shell: bash -el {0}
      run: |
          source ../scripts/ci/conda/compile.sh
      working-directory: ./entwine-feedstock

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-conda-package
        path: ./entwine-feedstock/packages/

    # Tags only, and never on a pull request, so the token stays out of runs
    # that anyone can open. Each platform uploads its own architecture. The
    # channel is whichever account the token belongs to, so there is no
    # username here to get wrong.
    - name: Publish to anaconda.org
      if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'ArkounM'
      shell: bash -el {0}
      working-directory: ./entwine-feedstock
      env:
        ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      run: |
        if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "ERROR: ANACONDA_API_TOKEN is not set on this repository." >&2
            exit 1
        fi
        conda install -y -c conda-forge anaconda-client
        # --skip-existing so re-running a tag does not fail on what is already up.
        anaconda -t "$ANACONDA_API_TOKEN" upload \
            --label main --skip-existing \
            packages/*/*.conda
